<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2e8d4">
  <meta name="screen-orientation" content="landscape">
  <meta name="description" content="Two Dragons — a two-player tic-tac-toe in an ink-wash garden.">
  <title>Two Dragons</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='6' y='6' width='88' height='88' rx='20' fill='%232b7a68'/%3E%3Cpath d='M30 30L70 70M70 30L30 70' stroke='%23f8f1e2' stroke-width='12' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="scenery" aria-hidden="true"></canvas>

  <main class="stage" id="stage">
    <header class="title-block">
      <div class="title-row">
        <span class="title-seal" id="title-seal-x" aria-hidden="true"></span>
        <h1 class="title">Two Dragons</h1>
        <span class="title-seal" id="title-seal-o" aria-hidden="true"></span>
      </div>
      <p class="meta"><span id="round-label">Round 1</span><span class="dot" aria-hidden="true"></span><span id="draws-label">Draws 0</span></p>
    </header>

    <div class="mode-panel">
      <fieldset class="segmented" id="mode-picker">
        <legend class="visually-hidden">Opponent</legend>
        <label><input type="radio" name="mode" value="pvp"><span>Two players</span></label>
        <label><input type="radio" name="mode" value="ai"><span>Vs computer</span></label>
      </fieldset>
      <fieldset class="segmented small" id="level-picker">
        <legend class="visually-hidden">Computer difficulty</legend>
        <label><input type="radio" name="level" value="easy"><span>Easy</span></label>
        <label><input type="radio" name="level" value="normal"><span>Normal</span></label>
        <label><input type="radio" name="level" value="hard"><span>Hard</span></label>
      </fieldset>
    </div>

    <div class="top-bar" role="toolbar" aria-label="Sound and display">
      <button class="icon-btn" id="music-toggle" type="button" aria-pressed="true" aria-label="Music" title="Music">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/><path class="slash" d="M3 3l18 18"/></svg>
      </button>
      <button class="icon-btn" id="sfx-toggle" type="button" aria-pressed="true" aria-label="Sound effects" title="Sound effects">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5L6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/><path class="slash" d="M3 3l18 18"/></svg>
      </button>
      <button class="icon-btn" id="fullscreen-toggle" type="button" aria-pressed="false" aria-label="Full screen" title="Full screen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
    </div>

    <section class="card" id="card-X" data-side="X" aria-labelledby="name-X" aria-describedby="role-X">
      <p class="role" id="role-X"></p>
      <div class="emblem" data-emblem="X" aria-hidden="true"></div>
      <h2 class="card-name" id="name-X"><span class="eyebrow">Jade</span> Dragon</h2>
      <p class="card-mark">Seal <b>X</b></p>
      <p class="card-score"><span class="score-value" id="score-X">0</span><span class="score-label">points</span></p>
      <p class="pill" id="pill-X">Your turn</p>
    </section>

    <section class="board-wrap" aria-label="Board">
      <div class="board" id="board">
        <div class="play-area">
          <div class="layer" id="grid-layer"></div>
          <div class="layer" id="win-layer"></div>
          <div class="cells" id="cells" role="group" aria-label="Game board, 3 by 3. Use arrow keys to move, Enter to place a seal."></div>
        </div>
      </div>
    </section>

    <section class="card" id="card-O" data-side="O" aria-labelledby="name-O" aria-describedby="role-O">
      <p class="role" id="role-O"></p>
      <div class="emblem" data-emblem="O" aria-hidden="true"></div>
      <h2 class="card-name" id="name-O"><span class="eyebrow">Vermilion</span> Phoenix</h2>
      <p class="card-mark">Seal <b>O</b></p>
      <p class="card-score"><span class="score-value" id="score-O">0</span><span class="score-label">points</span></p>
      <p class="pill" id="pill-O">Your turn</p>
    </section>

    <div class="status-wrap" id="status-wrap">
      <p class="status" id="status" aria-live="polite"></p>
      <p class="sub" id="sub" aria-live="polite"></p>
      <p class="hint" id="hint" role="status"></p>
    </div>

    <div class="actions">
      <button class="btn primary" id="new-round" type="button">New round</button>
      <button class="btn" id="reset" type="button">Reset game</button>
    </div>
  </main>

  <div class="rotate" aria-hidden="true">
    <svg viewBox="0 0 64 64"><rect x="20" y="8" width="24" height="44" rx="4"/><path d="M50 40a18 18 0 0 1-18 18M14 24A18 18 0 0 1 32 6"/><path d="M28 54l4 4-4 4M36 2l-4 4 4 4"/></svg>
    <p>Please rotate your device to landscape.</p>
  </div>

  <dialog class="confirm" id="confirm-dialog" aria-labelledby="confirm-title" aria-describedby="confirm-body">
    <form method="dialog">
      <h2 id="confirm-title"></h2>
      <p id="confirm-body"></p>
      <div class="confirm-actions">
        <button class="btn" id="confirm-cancel" value="cancel">Cancel</button>
        <button class="btn primary" id="confirm-ok" value="confirm"></button>
      </div>
    </form>
  </dialog>

  <script src="js/logic.js"></script>
  <script src="js/art.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
