<!doctype html><meta charset="utf-8">
<!-- Renders each sound effect of js/audio.js to a 16-bit 44.1 kHz stereo WAV, through the real engine
     (compressor and reverb included), for the Android APK. Driven by tools/render_sounds.py. -->
<script src="../js/audio.js"></script>
<script>
const RATE = 44100;
function wav(left, right) {
  const n = left.length;
  const out = new DataView(new ArrayBuffer(44 + n * 4));
  const str = (o, s) => [...s].forEach((c, i) => out.setUint8(o + i, c.charCodeAt(0)));
  str(0, 'RIFF'); out.setUint32(4, 36 + n * 4, true); str(8, 'WAVEfmt ');
  out.setUint32(16, 16, true); out.setUint16(20, 1, true); out.setUint16(22, 2, true);
  out.setUint32(24, RATE, true); out.setUint32(28, RATE * 4, true); out.setUint16(32, 4, true); out.setUint16(34, 16, true);
  str(36, 'data'); out.setUint32(40, n * 4, true);
  for (let i = 0; i < n; i++) {
    out.setInt16(44 + i * 4, Math.max(-1, Math.min(1, left[i])) * 32767, true);
    out.setInt16(46 + i * 4, Math.max(-1, Math.min(1, right[i])) * 32767, true);
  }
  return out.buffer;
}
(async () => {
  const AudioEngine = window.TwoDragonsAudio;
  for (const [name, play] of Object.entries(AudioEngine.EFFECTS)) {
    const off = new OfflineAudioContext(2, RATE * 6, RATE);
    const engine = new AudioEngine({ music: false, sfx: true, nativeAudio: null, AudioContextClass: function () { return off; } });
    engine.init();
    play(engine);
    const buf = await off.startRendering();
    const l = buf.getChannelData(0), r = buf.getChannelData(1);
    let last = 0, peak = 0;
    for (let i = 0; i < l.length; i++) {
      const v = Math.max(Math.abs(l[i]), Math.abs(r[i]));
      peak = Math.max(peak, v);
      if (v > 0.0005) last = i;
    }
    const end = Math.min(l.length, last + Math.floor(RATE * 0.05));
    // Short fade-out so the trimmed tail does not click.
    const fade = Math.floor(RATE * 0.04);
    for (let i = Math.max(0, end - fade); i < end; i++) { const k = (end - i) / fade; l[i] *= k; r[i] *= k; }
    await fetch(`/save/${name}.wav?peak=${peak.toFixed(3)}&seconds=${(end / RATE).toFixed(2)}`,
      { method: 'POST', body: wav(l.subarray(0, end), r.subarray(0, end)) });
  }
  await fetch('/done', { method: 'POST' });
})().catch((e) => fetch('/log', { method: 'POST', body: String(e && e.stack || e) }));
</script>
